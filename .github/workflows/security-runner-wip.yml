name: Security runner fail-closed regression (WIP)

on:
  push:
    branches:
      - wip/security-suite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  failclosed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify runner failures are never reported as successes
        run: python3 -m unittest discover -s tests -p test_security_suite_runner.py -v
