# Publishes tapiOca's releases on GitHub, from docs/releases/: each
# v<version>.md there names the commit of that version (on main) and holds
# its notes. For each one not yet published, this makes the tag at that
# commit and the release, with the release's files built from that commit:
# tapioca-<version>.zip (unzipping to src), tapioca-server.yaml (named
# stationplay.yaml before 1.35.0: the commit's own name) and
# docker-compose.yml, and tapioca-<version>-packages.txt, the list of
# every package in the image that was tested (tools/sbom.py, made by an
# image workflow run that tested it; the tests' own additions aside), with
# SHA256SUMS, the SHA-256 of each of them. A release already published is
# left as it is (a draft isn't one: a draft left by a run that stopped is
# deleted, and the release made again). The newest version is marked the
# latest release.
#
# From FIRST_IMAGE, the image is published too (the owner, October 12: D4
# is No, U1): the very one the image workflow tested, by digest (C7), gets
# the tags :<version>, :<major.minor> (if it's the newest of its minor
# versions) and :latest (if it's the newest), copied as it is, never built
# again, and checked; SHA256SUMS gives its digest by :<version>. The release
# also carries the arm64 image's list of packages, and the source of every
# GPL and LGPL package in the images, as Debian publishes it (C6:
# tools/gpl_source.py).
#
# A release goes ahead only once anyone can pull its image without signing
# in (the package must be public). It's made a draft first, with all its
# files; only then are the image's tags copied, and the draft published.
#
# The zip and SHA256SUMS are signed (tapioca-<version>.zip.sig and
# SHA256SUMS.sig: SSH signatures, namespace tapioca-release, by the key
# in RELEASE_SIGNING_KEY, checked against release-signing.pub), which every
# release needs from FIRST_SIGNED (1.34.0, the first with an image to tie
# to: the 1.34.0 audit); before that, a release whose files can't be signed
# was published without the signatures, and said. The key is on
# disk only while signing, and removed straight after, whatever happens.
#
# Versions before FIRST_PUBLIC are never published: tapiOca's public
# releases here start with 1.32.0 (the repository was started afresh then).
#
# A version is published only once the image workflow's tests have passed
# on its commit, or on a later main commit with nothing but release notes
# changed since (a version's commit, then its notes on top, is how releases
# are made): its Test step, on both machines. So this runs when an image run
# on main finishes, not when main changes: a version whose tests are still
# running waits for them, and one whose tests failed isn't published, with
# a line on the run's page saying why.
#
# A push of release notes alone starts no image run (image.yml leaves
# docs/releases/ out), so it starts this directly; a version whose tests are
# still running then waits, and is published when that run finishes. Either
# way, the notes' words are checked first (tests/test_wording.py), and a
# version is published only from an image run that tested its commit.
#
# It runs only in tapiOca's own repository (a fork's copy does nothing),
# and keeps no credentials in its checkout.
name: release

on:
  workflow_run:
    workflows: [image]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ["docs/releases/**"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read # (the image workflow's runs, and the package list each made)
  packages: write # (a version's tags on its tested image)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'egadgetboy/tapioca-server'
    runs-on: ubuntu-24.04
    # (The images' sources are fetched from Debian for each release.)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0 # (every version's commit)
          persist-credentials: false
      # A push with anything besides release notes in it has its own image
      # run, which starts this again when it finishes: publishing waits for
      # that (and isn't refused before the run is even listed).
      - name: Was this push release notes alone?
        id: pushed
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
            && [ -z "$(git diff --name-only "$BEFORE" "$AFTER" -- . ':(exclude)docs/releases/')" ]; then
            echo "notes_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "notes_only=false" >> "$GITHUB_OUTPUT"
            echo "::notice::This push has more than release notes: its image run publishes what's ready when it finishes"
          fi
      # (The words test needs only pytest: --noconftest leaves out
      # tests/conftest.py, which needs the app and its libraries.)
      - name: Check the notes' words
        if: github.event_name != 'push' || steps.pushed.outputs.notes_only == 'true'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/words"
          "$RUNNER_TEMP/words/bin/pip" install --quiet pytest==9.1.1
          "$RUNNER_TEMP/words/bin/python" -m pytest -q -p no:cacheprovider --noconftest tests/test_wording.py
      - name: Publish what's new
        if: github.event_name != 'push' || steps.pushed.outputs.notes_only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST_PUBLIC: "1.32.0"
          FIRST_IMAGE: "1.34.0"
          FIRST_SIGNED: "1.34.0"
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # (Whether version $1 is $2 or later.)
          from() { [ "$(printf '%s\n' "$1" "$2" | sort -V | head -1)" = "$2" ]; }
          # Signing: who may sign, and the key's place, where it's put only
          # while signing (and removed on any exit, too).
          key="$RUNNER_TEMP/signing-key"
          trap 'rm -f "$key"' EXIT
          allowed="$RUNNER_TEMP/allowed_signers"
          printf 'tapioca-release namespaces="tapioca-release" %s\n' "$(cat release-signing.pub 2>/dev/null || true)" > "$allowed"
          # Signs file $1 (as $1.sig) and checks the signature with the
          # published key; the key is on disk only meanwhile.
          sign() {
            local signed=1
            rm -f "$1.sig"
            if [ -n "${SIGNING_KEY:-}" ]; then
              if (umask 077; printf '%s\n' "$SIGNING_KEY" > "$key") \
                && ssh-keygen -Y sign -q -f "$key" -n tapioca-release "$1" < /dev/null \
                && ssh-keygen -Y verify -f "$allowed" -I tapioca-release -n tapioca-release \
                  -s "$1.sig" < "$1"; then
                signed=0
              fi
              rm -f "$key"
            fi
            if [ "$signed" != 0 ]; then rm -f "$1.sig"; fi
            return "$signed"
          }
          signed_in=""
          # The releases out (drafts aside: a draft isn't one), and drafts.
          releases=$(gh release list --limit 1000 --json tagName,isDraft --jq '.[] | "\(.tagName) \(.isDraft)"')
          published=$(awk '$2 == "false" { print $1 }' <<< "$releases")
          drafts=$(awk '$2 == "true" { print $1 }' <<< "$releases")
          # The image workflow's recent runs on main: commit, run, status.
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/image.yml/runs?branch=main&per_page=100" \
            --jq '.workflow_runs[] | "\(.head_sha) \(.id) \(.status)"')
          # (None yet, before a version's notes are pushed: nothing to do.)
          versions=$(ls docs/releases/v*.md 2>/dev/null | sed 's|.*/v\(.*\)\.md|\1|' | sort -V || true)
          newest=$(tail -1 <<< "$versions")
          refused=0
          for version in $versions; do
            tag="v$version"
            file="docs/releases/$tag.md"
            if ! from "$version" "$FIRST_PUBLIC"; then
              echo "$tag: before $FIRST_PUBLIC, never published"
              continue
            fi
            if grep -qxF "$tag" <<< "$published"; then
              echo "$tag: already published"
              continue
            fi
            # A draft of it, left by a run that stopped: deleted, and made again.
            for _ in $(grep -xF "$tag" <<< "$drafts" || true); do
              gh release delete "$tag" --yes
              echo "$tag: deleted the draft a run before this one left"
            done
            commit=$(sed -n '2s/^commit: \([0-9a-f]\{40\}\)$/\1/p' "$file")
            # Checks: the commit is on main, and is that version.
            if [ -z "$commit" ] || ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
              echo "::error::$file: its second line must be 'commit: <a commit's full ID>'"; exit 1
            fi
            if ! git merge-base --is-ancestor "$commit" origin/main; then
              echo "::error::$tag: commit $commit isn't on main"; exit 1
            fi
            if ! git show "$commit:app/__init__.py" | grep -q "^__version__ = \"$version\"$"; then
              echo "::error::$tag: app/__init__.py at $commit isn't version $version"; exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              if [ "$(git rev-parse "$tag^{commit}")" != "$commit" ]; then
                echo "::error::$tag already exists, at another commit"; exit 1
              fi
            fi
            # Its tests: image runs on main at its commit, or at a later one
            # with nothing but release notes changed since, that passed the
            # Test step on both machines (exactly two, each a success: one
            # cancelled, skipped or never reached isn't a pass; newest
            # first), or one still running.
            passed="" running="" failed=""
            while read -r sha run status; do
              [ -n "$sha" ] || continue
              git merge-base --is-ancestor "$commit" "$sha" 2>/dev/null || continue
              git merge-base --is-ancestor "$sha" origin/main || continue
              git diff --quiet "$commit" "$sha" -- . ':(exclude)docs/releases' || continue
              if [ "$status" != completed ]; then
                running=$run
                continue
              fi
              tested=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" \
                --jq '[.jobs[].steps[]? | select(.name == "Test") | .conclusion] | if length == 2 and all(. == "success") then "success" else "not passed" end')
              if [ "$tested" = success ]; then
                passed="$passed $run"
                continue
              fi
              failed=$run
            done <<< "$runs"
            if [ -z "$passed" ]; then
              if [ -n "$running" ]; then
                echo "::notice::$tag waits for its tests (image run $running): it's published when they pass"
              elif [ -n "$failed" ]; then
                echo "::error::$tag isn't published: its tests didn't pass (image run $failed)"
                refused=1
              else
                echo "::error::$tag isn't published: the image workflow hasn't tested its commit ${commit:0:7}, or a later main commit with nothing but release notes since (if that commit was pushed with [skip ci], start the image workflow on main by hand: Run workflow)"
                refused=1
              fi
              continue
            fi
            echo "$tag: its tests passed (image runs:$passed)"
            # The release's files, from that commit.
            out="$RUNNER_TEMP/$tag"
            mkdir -p "$out"
            git archive --format=zip --prefix=src/ -o "$out/tapioca-$version.zip" "$commit"
            # (The TrueNAS app file, by the name its commit gives it:
            # tapioca-server.yaml from 1.35.0, stationplay.yaml before.)
            yaml=tapioca-server.yaml
            git cat-file -e "$commit:$yaml" 2>/dev/null || yaml=stationplay.yaml
            git show "$commit:$yaml" > "$out/$yaml"
            git show "$commit:docker-compose.yml" > "$out/docker-compose.yml"
            # The notes: everything after the commit's lines.
            tail -n +4 "$file" | sed '/./,$!d' > "$out/notes.md"
            latest=false
            if [ "$version" = "$newest" ]; then latest=true; fi
            # The list of the packages in the image that was tested, made by
            # a run that passed (the image workflow's "Made of" step, after
            # Test; kept 90 days): the newest that has it. Without it, nothing
            # is published, and the run says what to do.
            listed=""
            for run in $passed; do
              if gh run download "$run" --name packages --dir "$out/made-$run" \
                && [ -s "$out/made-$run/tapioca-$version-packages.txt" ]; then
                listed="$out/made-$run/tapioca-$version-packages.txt"
                break
              fi
            done
            if [ -z "$listed" ]; then
              echo "::error::$tag isn't published: no image run that passed its tests (runs:$passed) has its list of packages. Re-run the newest of those runs (on its page: Re-run all jobs): publishing tries again when it finishes."
              refused=1
              continue
            fi
            made=$(dirname "$listed")
            mv "$listed" "$out/"
            files=("$out/tapioca-$version.zip" "$out/$yaml" "$out/docker-compose.yml"
              "$out/tapioca-$version-packages.txt")
            if from "$version" "$FIRST_IMAGE"; then
              # The image that run tested (both machines' images, joined),
              # by digest, and the arm64 image's list of packages.
              pinned=$(cat "$made/tapioca-$version-image.txt" 2>/dev/null || true)
              if ! [[ "$pinned" =~ ^ghcr\.io/[a-z0-9._-]+/tapioca-server@sha256:[0-9a-f]{64}$ ]] \
                || [ ! -s "$made/tapioca-$version-packages-arm64.txt" ]; then
                echo "::error::$tag isn't published: the image run that tested it kept no image or no arm64 list of packages. Re-run that run (Re-run all jobs): publishing tries again when it finishes."
                refused=1
                continue
              fi
              mv "$made/tapioca-$version-packages-arm64.txt" "$out/"
              files+=("$out/tapioca-$version-packages-arm64.txt")
              if [ -z "$signed_in" ]; then
                echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
                echo "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
                signed_in=yes
              fi
              # The source of every GPL and LGPL package in the images, as
              # Debian publishes it (C6), fetched in the tested image itself.
              mkdir -p "$out/source"
              if ! docker run --rm -i --user 0 --platform linux/amd64 -v "$out/source:/out" \
                  -v "$out/tapioca-$version-packages-arm64.txt:/in/arm64.txt:ro" "$pinned" \
                  python - --all --also /in/arm64.txt < tools/gpl_source.py; then
                echo "::error::$tag isn't published: the source of its images' GPL and LGPL packages couldn't all be fetched (the lines above say which). Run this workflow again later."
                refused=1
                continue
              fi
              tar -C "$out/source" -cf "$out/tapioca-$version-source.tar" .
              files+=("$out/tapioca-$version-source.tar")
            fi
            # The image's tags, from FIRST_IMAGE: on that very image, by digest.
            tags=()
            if from "$version" "$FIRST_IMAGE"; then
              image=${pinned%@*}
              digest=${pinned#*@}
              tags=("$version")
              minor=${version%.*}
              newest_minor=$(grep -E "^${minor//./\\.}\.[0-9]+$" <<< "$versions" | sort -V | tail -1)
              if [ "$version" = "$newest_minor" ]; then tags+=("$minor"); fi
              if [ "$latest" = true ]; then tags+=(latest); fi
            fi
            # Anyone must be able to pull the image, or nothing moves: no
            # draft, no tag (the 1.34.0 audit: :latest had moved before a
            # private package was found). The same package as every tag.
            if [ "${#tags[@]}" -gt 0 ] && ! skopeo inspect --no-creds --raw "docker://$pinned" > /dev/null; then
              echo "::error::$tag isn't published: its image can't be pulled without signing in to GitHub. tapiOca's package must be public: on GitHub, open the package's settings (Packages, then tapioca-server, then Package settings), set its visibility to Public, and run this workflow again."
              refused=1
              continue
            fi
            # SHA256SUMS: each file's SHA-256 (sha256sum -c --ignore-missing
            # checks them), then the image's digest by its own version's tag
            # (not :latest or :<minor>, which later releases move).
            sums="$out/SHA256SUMS"
            (cd "$out" && sha256sum "${files[@]##*/}") > "$sums"
            if [ "${#tags[@]}" -gt 0 ]; then
              printf '%s  %s\n' "${digest#sha256:}" "$image:$version" >> "$sums"
            fi
            files+=("$sums")
            # The zip and SHA256SUMS, signed (and the signatures checked with
            # the published key): needed from FIRST_SIGNED.
            zip="$out/tapioca-$version.zip"
            if sign "$zip" && sign "$sums"; then
              files+=("$zip.sig" "$sums.sig")
            elif from "$version" "$FIRST_SIGNED"; then
              echo "::error::$tag isn't published: its zip and SHA256SUMS couldn't be signed with RELEASE_SIGNING_KEY, or the signatures don't match release-signing.pub. The key must be the private half of release-signing.pub, with no passphrase."
              refused=1
              continue
            else
              echo "::warning::$tag's zip isn't signed, nor its SHA256SUMS: RELEASE_SIGNING_KEY is missing, has a passphrase, or doesn't match release-signing.pub."
              rm -f "$zip.sig" "$sums.sig"
            fi
            # The release, as a draft, with all its files; then the image's
            # tags, copied as it is, each checked; then it's published.
            gh release create "$tag" --target "$commit" --draft --title "tapiOca $version" \
              --notes-file "$out/notes.md" "${files[@]}"
            if [ "${#tags[@]}" -gt 0 ]; then
              for t in "${tags[@]}"; do
                skopeo copy --all --preserve-digests --quiet "docker://$pinned" "docker://$image:$t"
                got=$(skopeo inspect --raw "docker://$image:$t" | sha256sum | cut -d' ' -f1)
                if [ "sha256:$got" != "$digest" ]; then
                  echo "::error::$image:$t isn't the image that was tested"; exit 1
                fi
              done
              echo "::notice::$image: ${tags[*]} on $digest"
            fi
            gh release edit "$tag" --draft=false --latest="$latest"
            echo "::notice::Published $tag"
          done
          exit "$refused"
