# (Temporary, for 1.42.0: the picture floor test's whole table in the image, on
# both kinds of machine. Runs only on a push to wip/pictures; removed before
# the release.)
name: pictures-check

on:
  push:
    branches: [wip/pictures]
    paths: [".github/diag/**", ".github/workflows/pictures-check.yml"]

permissions:
  contents: read

jobs:
  table:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build
        run: docker build --target test --tag stationplay:test .
      - name: Table
        run: |
          docker run --rm stationplay:test sh -c 'ffmpeg -version | head -1; dpkg -l | grep -E "libwebp|libswscale|libavcodec6|libavfilter|libavformat" | cut -c1-90; nproc; grep -m1 -o -E "avx512[a-z]*|avx2|asimd" /proc/cpuinfo | sort -u'
          docker run --rm -e PYTHONPATH=/opt/stationplay -v "$PWD/.github/diag:/diag:ro" stationplay:test python /diag/pictures_table.py
