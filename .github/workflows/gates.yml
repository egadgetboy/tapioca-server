name: gates

# The gates checked by CI, not by hand: each release's manifest, the size
# ratchet on app/main.py, copied code, the standing rules in CLAUDE.md, the
# linters on changed lines, strict types on new modules, and the pinned
# dependencies scanned. Minutes, Ubuntu; the tools are pinned, and never ship.
on:
  push:
    branches: [main, 'chatgpt/**']  # (ChatGPT's branches run on each push)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: The update check asks for this repository
        # (A fork's own number differs, and its update check still asks
        # tapiOca's: so this step is tapiOca's own.)
        if: github.repository_owner == 'egadgetboy'
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          # (1.44.4: the update check asked by the number of the repository
          # before 1.44.2's fresh start, and GitHub answered 404.)
          python3 - <<'EOF'
          import os, re, sys
          code = open("app/releases.py", encoding="utf-8").read()
          found = re.findall(r"^REPOSITORY_ID = (\d+)$", code, re.M)
          want = os.environ["REPOSITORY_ID"]
          if found != [want]:
              said = ", ".join(found) or "not found"
              print(f"::error::REPOSITORY_ID in app/releases.py is {said}, but this repository's is {want}. The update check would ask GitHub for the wrong one.")
              sys.exit(1)
          EOF
      - name: The checks' own tests
        run: |
          # (They print what the checks print, ::error:: lines among them:
          # GitHub reads it all as text until the token comes back.)
          token=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
          echo "::stop-commands::$token"
          failed=0
          for t in tools/test_gates_run_check.py tools/test_release_gate.py tools/test_changed_lines.py tools/test_dep_scan.py tools/test_dupes.py tools/test_size_ratchet.py tools/test_claude_rules.py tools/test_mutate.py; do python3 "$t" || failed=1; done
          echo "::$token::"
          if [ "$failed" != 0 ]; then echo "::error::A check's own tests failed (above)"; exit 1; fi
      - name: The gates
        env:
          GH_TOKEN: ${{ github.token }}
          # (A Class D manifest's readiness record is checked against the plan.)
          PLAN_READ_TOKEN: ${{ secrets.PLAN_READ_TOKEN }}
        run: |
          python3 tools/release_gate.py --fetch-only  # (the history and tags: the checks below compare with them)
          python3 tools/release_gate.py lint
          python3 tools/size_ratchet.py
          python3 tools/dupes.py
          python3 tools/claude_rules.py
      - name: The plan can be read
        env:
          PLAN_READ_TOKEN: ${{ secrets.PLAN_READ_TOKEN }}
        run: python3 tools/release_gate.py --check-plan-token
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"  # (the image's)
      - name: Linters, on changed lines; dead code; strict types on new modules
        run: |
          set -o pipefail
          fail() { echo "::error::$1"; exit 1; }
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet ruff==0.14.2 vulture==2.14 mypy==2.4.0 -r requirements.txt || fail "couldn't install the linters"
          # (ruff's rules and complexity, on lines changed since the last release.)
          { "$RUNNER_TEMP/lint/bin/ruff" check --output-format concise --extend-select C901 . || true; } | python3 tools/changed_lines.py server || fail "ruff found something on a changed line (above)"
          # (Dead code, at vulture's high confidence: none, so all of it.)
          "$RUNNER_TEMP/lint/bin/vulture" app --min-confidence 80 | sed 's/^/::error::/' || fail "vulture found dead code"
          # (Strict types on each module added since 1.44.2.)
          new=$(git diff --name-only --diff-filter=A v1.44.2 HEAD -- 'app/*.py' 'app/**/*.py')
          if [ -n "$new" ]; then "$RUNNER_TEMP/lint/bin/mypy" --strict --follow-imports=silent $new || fail "mypy --strict on new modules (above)"; fi
      - name: Dependencies scanned
        run: python3 tools/dep_scan.py pypi requirements.txt "$RUNNER_TEMP/sbom.json"
