# Spike S-3 (the apps repo's docs/threat-models/server-proof.md): the image's
# own openssl and nice, on amd64 and arm64, building the image only (no
# tests, no push). Runs only on a push to a spike/ branch; never on main.
name: spike S-3
on:
  push:
    branches: ["spike/**"]
permissions:
  contents: read
jobs:
  s3:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build the image people get
        run: docker build --tag stationplay:spike .
      - name: The spike, inside it
        # pipefail: the spike's own exit decides. Each line becomes an
        # annotation, which the API can read (logs live on another host).
        run: |
          set -o pipefail
          docker run --rm -v "$PWD/tools/spikes:/spikes:ro" --entrypoint sh stationplay:spike /spikes/s3_openssl.sh \
            | while IFS= read -r line; do echo "::notice title=S-3 $(uname -m)::$line"; done
