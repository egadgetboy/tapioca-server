# tapiOca — TrueNAS SCALE custom app (TrueNAS SCALE 24.10 or later)
#
# Install: Apps > Discover Apps > ⋮ (top right) > Install via YAML.
# Name the app "stationplay" and paste this whole file.
#
# Before installing (README: Install > TrueNAS SCALE):
#   1. In System > Shell, make a data folder on a pool, and give it to the
#      user below:
#        sudo mkdir -p /mnt/tank/apps/stationplay/data
#        sudo chown -R 1000:1000 /mnt/tank/apps/stationplay/data
#   2. Change every line marked  <- CHANGE. On a volumes line, change only
#      the folder on your server, the part before :/data or :/media.
#
# Paths are case-sensitive: Data and data are different folders.
#
# To update: follow the steps tapiOca's page gives when a new version
# is out, or the README's Updating section.

services:
  stationplay:
    image: ghcr.io/egadgetboy/tapioca-server:latest     # the newest release; :1.34 or :1.34.0 stays on one
    pull_policy: missing                             # fetched only when it isn't here: starting never needs the internet
    container_name: stationplay
    restart: unless-stopped
    init: true
    # The user tapiOca runs as. It needs write access to the data folder
    # and read access to your media. (TrueNAS's built-in apps user is 568:568.)
    user: "1000:1000"                                # <- CHANGE if your media belongs to another user
    ports:
      - "3310:3310"     # Plex and your home network. Never forward it or tunnel to it.
      # tapiOca's page and apps from the internet: point your reverse proxy
      # or Cloudflare Tunnel at this one (README: "Security and remote
      # access"). Plex's addresses aren't on it, and signing in is always
      # required. Remove this line and PUBLIC_PORT below if you don't need it.
      - "3311:3311"
    environment:
      TAPIOCA_INSTALL: "truenas"                     # how the page says to update (README: Updating)
      PLEX_URL: "http://192.168.1.10:32400"          # <- CHANGE to your Plex server's address
      PLEX_TOKEN: "paste-your-plex-token-here"       # <- CHANGE (README: "Finding your Plex token")
      # (No Plex? Delete the two lines above, and add Media folders of your own on tapiOca's page.)
      TZ: "America/Chicago"                          # <- CHANGE to your time zone
      PORT: "3310"
      PUBLIC_PORT: "3311"
      # Where tapiOca sees your media, inside its container. Leave it as
      # /media: the media line under volumes puts your folder there.
      MEDIA_DIR: "/media"                            # leave as it is
      # auto = use a GPU if one passes a test encode, otherwise the CPU.
      # Other values: intel, amd, nvidia, cpu
      HW_ACCEL: "auto"
    volumes:
      # Each line is the folder on your server, then where tapiOca sees it
      # (and :ro, read-only). Change only the folder on your server.
      # Stations, settings, logos, the Broken files list and backups:
      - /mnt/tank/apps/stationplay/data:/data        # <- CHANGE /mnt/tank/apps/stationplay/data
      # Your media folder, read-only. tapiOca matches the paths Plex
      # reports to this folder automatically.
      - /mnt/tank/media:/media:ro                    # <- CHANGE /mnt/tank/media

    # --- GPU: Intel or AMD (such as Quick Sync) --------------------------
    # If the server has no Intel or AMD graphics, delete everything from
    # "devices:" down to the "107" line: the app won't start without /dev/dri.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      # The group that owns /dev/dri/renderD128, so tapiOca may use the
      # GPU. 107 is the usual TrueNAS value; check with:  ls -ln /dev/dri
      - "107"

    # --- GPU: NVIDIA ----------------------------------------------------
    # First turn on Apps > Configure > Settings > Install NVIDIA Drivers.
    # Then uncomment these lines (and remove the Intel/AMD lines above if
    # there's no /dev/dri):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

    # It runs as an ordinary user, and may never gain privileges or keep any
    # it doesn't need.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
