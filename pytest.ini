[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# A test still going after this long (seconds) prints where every thread is:
# with -v (as the image workflow runs them), after the test's name, so one
# that hangs names itself. It carries on, till the run's time limit.
faulthandler_timeout = 300
filterwarnings =
    # A test-only helper (starlette.testclient) announcing its own future change.
    ignore:Using `httpx` with `starlette.testclient`
markers =
    info_station: a new tapiOca's INFO station is made, as it is outside the tests (see conftest.py)
